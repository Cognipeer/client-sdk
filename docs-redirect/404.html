<title>Documentation has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://docs.cognipeer.com/client-sdk/">
<script>
(function () {
  var base = "/client-sdk/";
  var path = location.pathname;
  var p = path.indexOf(base) === 0 ? path.slice(base.length) : "";
  p = p.replace(/^\/+/, "").replace(/\.html$/, "");
  var target = 'client-sdk/' + p;
  location.replace("https://docs.cognipeer.com/" + target + location.hash);
})();
</script>
<p>This documentation now lives at <a href="https://docs.cognipeer.com/client-sdk/">docs.cognipeer.com</a>.</p>
